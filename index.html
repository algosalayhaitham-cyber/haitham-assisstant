<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>هيثم AI</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="./styles.css">

  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">هيثم <span>AI</span></div>
      <div class="subtitle">المساعد التعليمي الذكي</div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <button id="themeToggle" class="theme-toggle-btn" title="تبديل المظهر">🌙</button>
      <div class="badge">الإصدار 1.0</div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <p class="eyebrow">مرحبًا بك أستاذ هيثم</p>
        <h1>ماذا تريد أن تنجز اليوم؟</h1>
        <p>مساعدك الذكي لإعداد التحضير، بنوك الأسئلة، الشروحات الرياضية، والأعمال المدرسية.</p>
      </div>
      <div class="hero-mark">∑</div>
    </section>

    <section class="grid">
      <button class="card" data-category="تحضير" data-prompt="أريد تحضير درس رياضيات شامل ومكتمل العناصر (الأهداف، التمهيد، الاستراتيجيات، الوسائل، التقويم، الواجب). اطلب مني الصف واسم الدرس أولاً.">
        <b>📚</b><strong>تحضير درس</strong><small>خطة درس معتمدة ومكتملة</small>
      </button>

      <button class="card" data-category="اختبارات" data-prompt="أريد إنشاء اختبار رياضيات متكامل مع نموذج الإجابة وسلم الدرجات. اطلب مني تحديد الصف، الدروس، وعدد الأسئلة.">
        <b>📝</b><strong>إنشاء اختبار</strong><small>أسئلة متنوعة + نموذج الإجابة</small>
      </button>

      <button class="card" data-category="مواصفات" data-prompt="أريد جدول مواصفات اختبار رياضيات متكامل في جدول منظم يحتوي على (الوحدات، الدروس، الوزن النسبي، مستويات الأهداف، عدد الأسئلة والدرجات). اطلب مني الصف والمواضيع.">
        <b>📊</b><strong>جدول مواصفات</strong><small>توزيع الدرجات والأهداف</small>
      </button>

      <button class="card" data-category="حل مسائل" data-prompt="أريد شرح خطوات حل مسألة رياضية بالخطوات بالتفصيل والرموز الدقيقة. اطلب مني إرسال المسألة الآن.">
        <b>📐</b><strong>حل مسألة</strong><small>خطوات تفصيلية + شرح تعليمي</small>
      </button>

      <button class="card" data-category="إعلانات" data-prompt="أريد صياغة تعميم أو إعلان مدرسي رسمي ومحفز للطلاب والأولياء. اطلب مني التفاصيل والمناسبة.">
        <b>🏫</b><strong>إعلان مدرسي</strong><small>تعاميم ونشرات رسمية</small>
      </button>

      <button class="card" data-category="خطط علاجية" data-prompt="أريد خطة علاجية لرفع مستوى الطلاب ضعاف التحصيل في الرياضيات. اطلب مني تحديد المهارة المستهدفة والصف.">
        <b>🎓</b><strong>خطة علاجية</strong><small>استراتيجيات ودعم للطلاب</small>
      </button>
    </section>

    <section class="chat">
      <div class="chat-header">
        <div class="category-tabs">
          <button class="tab-btn active" data-filter="all">الكل</button>
          <button class="tab-btn" data-filter="تحضير">📚 تحضير</button>
          <button class="tab-btn" data-filter="اختبارات">📝 اختبارات</button>
          <button class="tab-btn" data-filter="حل مسائل">📐 مسائل</button>
          <button class="tab-btn" data-filter="إعلانات">🏫 إعلانات</button>
        </div>
        <button id="clearChatBtn" class="clear-chat-btn">محادثة جديدة ➕</button>
      </div>

      <div id="messages" class="messages"></div>

      <div id="imagePreviewContainer" class="image-preview-container" style="display: none;">
        <img id="imagePreview" src="" alt="المعاينة">
        <button type="button" id="removeImageBtn" class="remove-img-btn">✕</button>
      </div>

      <form id="chatForm" class="composer">
        <label for="imageInput" class="upload-btn" title="أرفق صورة مسألة أو مستند">
          📷
          <input type="file" id="imageInput" accept="image/*" style="display: none;">
        </label>

        <button type="button" id="voiceBtn" class="voice-btn" title="تحدث بالصوت">🎤</button>

        <textarea id="input" rows="2" placeholder="اكتب طلبك هنا أو اضغط 🎤 للتحدث..." required></textarea>
        <button type="submit">إرسال ➤</button>
      </form>
    </section>
  </main>

  <footer>هيثم AI — ذكاءٌ يصنع التعلُّم</footer>
  <script src="/app.js"></script>
</body>
</html>
