<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>الأستاذ هيثم القصلي | مرحباً</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tahoma', 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, #0b0e1a 0%, #1a1f35 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            max-width: 520px;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 56px;
            padding: 40px 30px 35px;
            box-shadow: 0 40px 90px rgba(0, 0, 0, 0.7);
            text-align: center;
            animation: floatUp 0.9s ease;
        }
        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(50px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .logo-container { margin: 0 auto 15px; text-align: center; }
        .logo-image { max-width: 160px; height: auto; border-radius: 16px; filter: drop-shadow(0 8px 30px rgba(255,215,0,0.15)); transition: 0.3s; }
        .logo-image:hover { transform: scale(1.03); }
        .avatar-wrapper {
            width: 130px; height: 130px; margin: 0 auto 18px; border-radius: 50%;
            padding: 5px; background: linear-gradient(135deg, #f6b26b, #e67e22);
            box-shadow: 0 12px 40px rgba(230,126,34,0.35);
        }
        .avatar-wrapper img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 4px solid #0b0e1a; display: block; }
        .name { font-size: 30px; font-weight: 700; color: #ffffff; margin-top: 4px; line-height: 1.3; }
        .name .highlight { background: linear-gradient(to left, #f6b26b, #f1c40f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .title { font-size: 17px; color: rgba(255,255,255,0.6); margin: 6px 0 16px; font-weight: 400; }
        .title strong { color: #f6b26b; font-weight: 600; }
        .divider { width: 70px; height: 3px; background: linear-gradient(90deg, #f6b26b, #e67e22); margin: 12px auto 22px; border-radius: 10px; }
        .desc { color: rgba(255,255,255,0.55); font-size: 15px; line-height: 1.8; margin-bottom: 28px; }
        .btn-group { display: flex; flex-direction: column; gap: 14px; }
        .btn {
            display: inline-block; padding: 16px 20px; border-radius: 60px; font-size: 18px;
            font-weight: 600; text-decoration: none; transition: 0.3s ease;
            border: none; cursor: pointer; width: 100%; text-align: center;
        }
        .btn-primary { background: linear-gradient(135deg, #f6b26b, #e67e22); color: #0b0e1a; box-shadow: 0 10px 30px rgba(230,126,34,0.3); }
        .btn-primary:hover { transform: scale(1.03); box-shadow: 0 16px 40px rgba(230,126,34,0.5); }
        .btn-outline { background: transparent; border: 2px solid rgba(255,255,255,0.15); color: #fff; }
        .btn-outline:hover { background: rgba(255,255,255,0.06); border-color: #f6b26b; }
        .footer-note { margin-top: 24px; font-size: 13px; color: rgba(255,255,255,0.2); }
        @media (max-width: 480px) {
            .card { padding: 30px 18px; }
            .avatar-wrapper { width: 110px; height: 110px; }
            .name { font-size: 24px; }
            .logo-image { max-width: 120px; }
        }
    </style>
</head>
<body>

<div class="card">

    <!-- 👇 شعار القائد الصغير -->
    <div class="logo-container">
        <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMgAAABkCAYAAADDhn8AAAAAXNSR0IArs4c6QAAAARzQklUCAgICHwIZAAAAAlwSFlzAAAOxAAADsQBlSsOGwAAABl0RVh0U29mdHdhcmUAd3d3Lmlua3NjYXBlLm9yZ5vuPBoAAAgSSURBVHic7Z1bbBxVGMf/38zZ..." alt="شعار القائد الصغير" class="logo-image">
    </div>

    <!-- 👇 صورتك الشخصية -->
    <div class="avatar-wrapper">
        <img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgICAg..." alt="الأستاذ هيثم القصلي" />
    </div>

    <!-- 👇 اسمك -->
    <div class="name">
        الأستاذ <span class="highlight">هيثم القصلي</span>
    </div>

    <div class="title">
        <strong>🧑‍🏫 مدرس مادة الرياضيات</strong>
    </div>

    <div class="divider"></div>

    <div class="desc">
        مرحباً بك في منصتي التعليمية 🧠<br>
        هنا نصنع التميز معاً – تصحيح، شرح، وتطوير مستمر.
    </div>

    <!-- 👇 الأزرار (الروابط الصحيحة) -->
    <div class="btn-group">
        <!-- ✅ هذا الزر يودي إلى الصفحة الرئيسية (المحادثة) -->
        <a href="/" class="btn btn-primary">
            🚀 دخول إلى المنصة
        </a>

        <!-- ✅ هذا الزر يودي إلى صفحة التصحيح -->
        <a href="correction.html" class="btn btn-outline">
            📝 تصحيح أوراق
        </a>

        <!-- ✅ هذا الزر يودي إلى المكتبة -->
        <a href="library.html" class="btn btn-outline">
            📚 المكتبة
        </a>
    </div>

    <div class="footer-note">
        © 2026 الأستاذ هيثم القصلي – جميع الحقوق محفوظة
    </div>

</div>

</body>
</html>
